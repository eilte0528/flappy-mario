<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Mario v3</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <span>SC <b id="sc">0</b></span>
      <span>BEST <b id="bs">0</b></span>
      <span>COINS <b id="cn">0</b></span>
      <span>SPD <b id="sp">1x</b></span>
      <span class="bar-wrap">🧲<span class="bar"><span class="bar-fill" id="mf"></span></span></span>
      <span class="bar-wrap">🔄<span class="bar"><span class="bar-fill" id="gf"></span></span></span>
      <span class="bar-wrap">⭐<span class="bar"><span class="bar-fill" id="gs"></span></span></span>
      <span>🚩 <b id="ck">—</b></span>
    </div>
    <canvas id="c" width="640" height="480"></canvas>
  </div>
  <script src="script.js"></script>
</body>
</html>
